# The app that gets scaled. Names match the earlier practice setup (hpa-demo).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hpa-demo
spec:
  replicas: 1
  selector:
    matchLabels: {app: hpa-demo}
  template:
    metadata:
      labels: {app: hpa-demo}
    spec:
      containers:
        - name: app
          image: hpa-workload:1.0
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8080}]
          resources:
            requests: {cpu: 100m, memory: 64Mi}   # HPA percentage is measured against this
            limits:   {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            periodSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: hpa-demo
spec:
  selector: {app: hpa-demo}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hpa-demo
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hpa-demo
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 50}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60   # default is 300; shorter so you see scale-down sooner
